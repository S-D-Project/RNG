name: PLAN intake focused tests

on:
  pull_request:
    branches: [develop]
    paths:
      - "Tools/PlanIntake/**"
      - ".github/workflows/plan-intake.yml"
  push:
    paths:
      - "Tools/PlanIntake/**"
      - ".github/workflows/plan-intake.yml"

permissions:
  contents: read

jobs:
  focused:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r Tools/PlanIntake/requirements.txt
      - run: python -B -m unittest discover -s Tools/PlanIntake/tests -v
